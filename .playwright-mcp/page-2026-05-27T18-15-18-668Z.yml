          - paragraph [ref=e223]: 03 — Design Challenges
          - heading "The Hard Problems" [level=2] [ref=e224]
          - paragraph [ref=e225]: Three design tensions from the Imagine Learning engagement — shareable without violating NDA.
        - generic [ref=e226]:
          - generic [ref=e227]:
            - heading "AI Confidence ≠ User Trust" [level=3] [ref=e228]
            - paragraph [ref=e229]: The rubric engine outputs confidence scores, but showing raw percentages caused teachers to either over-trust (80% feels like a guarantee) or dismiss (60% feels unreliable). Designed a 3-tier signal system (Verified / Suggested / Uncertain) that anchored decisions in pedagogical context, not probability.
            - generic [ref=e230]:
              - paragraph [ref=e231]: Outcome
              - paragraph [ref=e232]: Teacher acceptance rate increased from 41% to 74% in A/B testing.
          - generic [ref=e233]:
            - heading "GenAI Latency UX" [level=3] [ref=e234]
            - paragraph [ref=e235]: "Rubric generation takes 3-8 seconds — far longer than users expect from 'AI'. A generic spinner caused drop-off. Designed a progressive reveal: skeleton rubric structure appears immediately, then cells populate sequentially, creating a perception of real-time generation."
            - generic [ref=e236]:
              - paragraph [ref=e237]: Outcome
              - paragraph [ref=e238]: Drop-off during generation reduced by 55%.
          - generic [ref=e239]:
            - heading "One system, five teams" [level=3] [ref=e240]
            - paragraph [ref=e241]: Five product teams had divergent component needs — elementary literacy, middle-school math, special ed, teacher dashboards, admin tools. Designed a token layer with 4 semantic contexts (learner, educator, admin, assessment) that let the same components adapt across surfaces.
            - generic [ref=e242]:
              - paragraph [ref=e243]: Outcome
              - paragraph [ref=e244]: Unified system with zero hard forks across 5 products.
