            - generic [ref=e524]: Design Constraint
            - heading "Figma plugin API shapes every interaction decision" [level=3] [ref=e525]
            - paragraph [ref=e526]: The plugin runtime has no background threads — every scan must complete synchronously within a 60fps canvas budget. This ruled out streaming results, forced a batch-scan model, and made the progressive reveal of violations (grouped, not streamed) a technical necessity, not just a UX preference.
          - generic [ref=e527]:
            - img [ref=e529]
            - generic [ref=e531]: What didn't work
            - heading "V1 had drag-to-reorder violations — too complex" [level=3] [ref=e532]
            - paragraph [ref=e533]: The first violations list let users drag-and-drop to reprioritize issues. In beta testing with junior designers (primary target users), this interaction pattern caused confusion — they expected the list to be sorted by severity, not be a task manager. Removed it in v2 and defaulted to severity-ordered, read-only grouping. Fix rate improved.
          - generic [ref=e534]:
            - img [ref=e536]
            - generic [ref=e539]: Next time
            - heading "Design decisions need to be documented as they happen" [level=3] [ref=e540]
            - paragraph [ref=e541]: When context-switching between design and engineering, I lost the rationale for several key UX decisions. I now maintain a lightweight decision log alongside the codebase.
        - generic [ref=e542]:
          - paragraph [ref=e543]: Aulys is still evolving. The CI/CD platform is in active development — and with 30 beta designers giving live feedback, it's going in the right direction.
          - paragraph [ref=e544]: "What Aulys proved: a solo designer-founder, using AI tools for execution, can ship a real accessibility product with real users — in less time than most teams take to write a PRD. The constraint wasn't capability. It was knowing exactly what problem to solve and refusing to scope-creep past it."
