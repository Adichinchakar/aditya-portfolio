          - paragraph [ref=e321]: 03 — Design Leadership
          - heading "Beyond the Screen" [level=2] [ref=e322]
          - paragraph [ref=e323]: As the only senior designer on the product team, I owned the design function end-to-end — not just the pixels.
        - generic [ref=e324]:
          - generic [ref=e325]:
            - generic [ref=e326]: "01"
            - heading "Weekly design crits" [level=3] [ref=e327]
            - paragraph [ref=e328]: Ran structured critique sessions with 3 product designers and 2 frontend engineers every Thursday. Introduced a feedback rubric (usability, visual hierarchy, accessibility, business alignment) that reduced revision cycles from 3+ rounds to an average of 1.4.
          - generic [ref=e329]:
            - generic [ref=e330]: "02"
            - heading "Mentored a junior designer" [level=3] [ref=e331]
            - paragraph [ref=e332]: Paired with a junior UX designer joining the team in Q2 2022. Set a structured 60-day onboarding plan covering Simplifai's design system, design token discipline, and usability testing methodologies. They shipped their first solo feature within 10 weeks.
          - generic [ref=e333]:
            - generic [ref=e334]: "03"
            - heading "Stakeholder alignment process" [level=3] [ref=e335]
            - paragraph [ref=e336]: "Presented design decisions monthly to the VP of Product and CTO using structured decision logs — a one-page doc covering: problem, options considered, decision made, and success metric. Eliminated the most common stakeholder change requests by building alignment before high-fidelity."
          - generic [ref=e337]:
            - generic [ref=e338]: "04"
            - heading "Established the first design system" [level=3] [ref=e339]
            - paragraph [ref=e340]: Initiated and built the Simplifai component library from scratch (no prior system existed). Defined a semantic token architecture, authored contribution guidelines, and ran a 2-day design system workshop with the engineering team to drive adoption. Led to 42% faster dev cycles.
