          - paragraph [ref=e316]:
            - strong [ref=e317]: "Why:"
            - text: Form-based UIs required users to leave the canvas to configure each node — 3 context switches per connection. Canvas-first kept intent and configuration co-located, cutting task completion time by 40% in usability testing.
      - generic [ref=e319]:
