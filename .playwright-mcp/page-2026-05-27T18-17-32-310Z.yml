      - generic [ref=e72]:
        - generic [ref=e73]:
          - paragraph [ref=e74]: 01 — Problem
          - heading "The $1.3T problem hiding in onboarding." [level=2] [ref=e75]:
            - text: The $1.3T problem
            - text: hiding in onboarding.
          - generic [ref=e76]:
            - generic [ref=e77]: $1.3T
            - generic [ref=e78]: lost annually to poor employee onboarding — Gallup, 2023
          - paragraph [ref=e79]: "Enterprise organisations spend thousands per hire on onboarding that still fails where it matters: inside the new hire's mental model of how the org actually works. The problem isn't information volume. It's spatial disorientation — new hires cannot see the map."
        - generic [ref=e80]:
          - paragraph [ref=e81]: The business frame
          - paragraph [ref=e82]:
            - text: A new enterprise hire reaching full productivity in week 3 instead of month 4 represents
            - strong [ref=e83]: 30+ recoverable working days
            - text: per person. At a 500-person annual intake, that compounds to a measurable revenue line — not a HR metric.
        - generic [ref=e84]:
          - generic [ref=e85]:
            - img [ref=e87]
            - heading "Context overload" [level=3] [ref=e91]
            - paragraph [ref=e92]: New hires are flooded with wikis, decks, org charts, Slack channels, and Notion pages on day one. The information exists. The structure does not. Context without spatial anchoring doesn't stick.
          - generic [ref=e94]:
            - img [ref=e96]
            - heading "Tool fragmentation" [level=3] [ref=e98]
            - paragraph [ref=e99]: The average enterprise employee uses 9.4 SaaS tools daily. New hires must context-switch between HRIS, Slack, Jira, Confluence, and email — before they understand what any of it is for.
          - generic [ref=e101]:
            - img [ref=e103]
            - heading "No spatial awareness" [level=3] [ref=e105]
            - paragraph [ref=e106]: Org charts are static, flat, and abstract. New hires cannot feel where they sit in the organisation, who the real decision-makers are, or how teams connect. This takes 3–6 months to build informally.
        - generic [ref=e108]:
          - paragraph [ref=e109]: Problem statement
          - paragraph [ref=e110]: Enterprise new hires are given a flood of information with no spatial structure to anchor it. The result is 3–6 months of below-capacity contribution, avoidable IT overhead, and talent attrition from disengagement — all traceable to a failure of context delivery on day one.
      - generic [ref=e113]:
        - generic [ref=e114]:
          - paragraph [ref=e115]: 02 — Research & Insight
          - heading "Three perspectives. One broken system." [level=2] [ref=e116]:
            - text: Three perspectives.
            - text: One broken system.
          - paragraph [ref=e117]: Synthesised from secondary research, published enterprise HR studies, and domain expertise. No primary user interviews — this is a speculative concept grounded in published evidence.
        - generic [ref=e118]:
          - generic [ref=e119]:
            - generic [ref=e120]:
              - img [ref=e122]
              - generic [ref=e127]:
                - paragraph [ref=e128]: New Hire
                - paragraph [ref=e129]: Priya, Software Engineer
                - paragraph [ref=e130]: "Core pain: Overwhelm"
            - blockquote [ref=e131]: “I have 47 unread Slack messages, a 90-page onboarding deck, and zero idea who actually makes decisions around here.”
            - paragraph [ref=e132]: "Insight: Context without spatial structure doesn't reduce overwhelm — it amplifies it. Priya can find information. She can't find her place."
          - generic [ref=e133]:
            - generic [ref=e134]:
              - img [ref=e136]
              - generic [ref=e140]:
                - paragraph [ref=e141]: HR Ops
                - paragraph [ref=e142]: Marcus, People Ops Lead
                - paragraph [ref=e143]: "Core pain: Scaling pain"
            - blockquote [ref=e144]: “We're onboarding 80 people a quarter. Our buddy system doesn't scale and our wiki is 4 years out of date.”
            - paragraph [ref=e145]: "Insight: HR teams know the current process fails at scale but cannot personalise onboarding without a 10× headcount increase."
          - generic [ref=e146]:
            - generic [ref=e147]:
              - img [ref=e149]
              - generic [ref=e152]:
                - paragraph [ref=e153]: IT Admin
                - paragraph [ref=e154]: Lan, IT Operations
                - paragraph [ref=e155]: "Core pain: Device fleet management"
            - blockquote [ref=e156]: “I spend two days per new hire on setup tickets. Half of them are basic things — app access, VPN config, printer setup.”
            - paragraph [ref=e157]: "Insight: IT overhead in week one is largely a context problem, not a technical one. New hires raise tickets because they don't know what they have access to."
        - generic [ref=e158]:
          - paragraph [ref=e159]: Key insight from secondary research
          - paragraph [ref=e160]: Spatial memory retention is significantly higher in 3D environments vs flat screens.
          - paragraph [ref=e161]: Research in cognitive science and spatial learning (including studies at Stanford's Virtual Human Interaction Lab) consistently shows that people navigate, recall, and build mental models more effectively in three-dimensional space. Our brains evolved to understand place. Enterprise onboarding ignores this completely.
        - generic [ref=e163]:
          - generic [ref=e164]:
            - paragraph [ref=e165]: The bet
            - paragraph [ref=e166]: Spatial org map on day one
            - paragraph [ref=e167]: A 3D, navigable map of the organisation — teams, tools, key people, and workflows — delivered spatially in visionOS collapses 3 weeks of informal context-building into 3 hours.
          - generic [ref=e168]:
            - paragraph [ref=e169]: The mechanism
            - paragraph [ref=e170]: AI agent as guide, not chatbot
            - paragraph [ref=e171]: A voice-first AI agent walks new hires through their spatial environment proactively — surfacing what they need before they know to ask. Not a search interface. A guide.
          - generic [ref=e172]:
            - paragraph [ref=e173]: The constraint
            - paragraph [ref=e174]: Progressive disclosure, not info dump
            - paragraph [ref=e175]: Orbit reveals depth planes of information on demand, tied to gaze focus and session progress. Context is earned, not front-loaded — preventing the overwhelm that makes flat onboarding fail.
      - generic [ref=e178]:
        - generic [ref=e179]:
          - paragraph [ref=e180]: 03 — Design Decisions
          - heading "Five decisions that defined the spatial UX." [level=2] [ref=e181]:
            - text: Five decisions that
            - text: defined the spatial UX.
          - paragraph [ref=e182]: Every design decision is a trade-off. Here are the five that most significantly shaped what Orbit is — and what it deliberately chose not to be.
        - generic [ref=e183]:
          - generic [ref=e185]:
            - img [ref=e187]
            - generic [ref=e190]:
              - generic [ref=e192]: "01"
              - heading "Gaze + pinch over controller input for primary navigation." [level=3] [ref=e193]
              - generic [ref=e194]:
                - generic [ref=e195]:
                  - paragraph [ref=e196]: We chose
                  - paragraph [ref=e197]: Gaze + pinch (visionOS native)
                - generic [ref=e198]:
                  - paragraph [ref=e199]: Over
                  - paragraph [ref=e200]: Controller-based cursor navigation
              - paragraph [ref=e201]: "Controller navigation imports the mental model of a mouse — a flat-screen metaphor that undermines the spatial premise of Orbit. Gaze + pinch is how visionOS was designed to be navigated: effortless, hands-free between actions, and mapped directly to where a user's attention already is. For enterprise onboarding, reducing motor overhead matters — new hires are cognitively loaded on day one. The interaction model should disappear into the experience."
          - generic [ref=e203]:
            - img [ref=e205]
            - generic [ref=e208]:
              - generic [ref=e210]: "02"
              - heading "Voice-first AI agent over traditional UI menus for guidance." [level=3] [ref=e211]
              - generic [ref=e212]:
                - generic [ref=e213]:
                  - paragraph [ref=e214]: We chose
                  - paragraph [ref=e215]: Proactive voice-first AI agent
                - generic [ref=e216]:
                  - paragraph [ref=e217]: Over
                  - paragraph [ref=e218]: Menu-driven navigation with optional AI assistant
              - paragraph [ref=e219]: A menu-driven UI externalises the cognitive work of knowing what to explore next. It assumes the user knows what questions to ask — which a day-one hire definitionally does not. A proactive voice-first agent surfaces the right context at the right moment, guided by session state, gaze history, and role-based onboarding paths. The agent doesn't answer questions. It anticipates them.
          - generic [ref=e221]:
            - img [ref=e223]
            - generic [ref=e227]:
              - generic [ref=e229]: "03"
              - heading "Progressive disclosure in 3D depth planes over flat menu hierarchy." [level=3] [ref=e230]
              - generic [ref=e231]:
                - generic [ref=e232]:
                  - paragraph [ref=e233]: We chose
                  - paragraph [ref=e234]: Depth-plane disclosure (foreground → mid → background)
                - generic [ref=e235]:
                  - paragraph [ref=e236]: Over
                  - paragraph [ref=e237]: Flat hierarchical menu navigation
              - paragraph [ref=e238]: "Flat menus map poorly to spatial environments — they force the user to mentally translate a 2D hierarchy into a 3D space they're already inhabiting. Depth planes use the Z-axis as a semantic layer: foreground is your immediate context, mid-ground is your department, background is the wider org. Depth is not decorative — it is the information architecture."
          - generic [ref=e240]:
            - img [ref=e242]
            - generic [ref=e245]:
              - generic [ref=e247]: "04"
              - heading "Enforced 60° FOV comfort zone over full spatial freedom." [level=3] [ref=e248]
              - generic [ref=e249]:
                - generic [ref=e250]:
                  - paragraph [ref=e251]: We chose
                  - paragraph [ref=e252]: 60° FOV constraint for all primary interaction zones
                - generic [ref=e253]:
                  - paragraph [ref=e254]: Over
                  - paragraph [ref=e255]: Unconstrained spatial UI across full 180° field of view
              - paragraph [ref=e256]: Apple's visionOS HIG specifies that placing interactive elements beyond 60° from centre gaze creates physical discomfort and forces excessive head movement. Unconstrained spatial UI would be visually impressive in a demo and exhausting in a real onboarding session lasting 2–3 hours. Orbit enforces the 60° comfort zone strictly for all primary interactions, reserving peripheral space for ambient environmental information only. Ergonomics is not a constraint — it is a feature.
          - generic [ref=e258]:
            - img [ref=e260]
            - generic [ref=e266]:
              - generic [ref=e268]: "05"
              - heading "Motion sensitivity toggle + dwell time customisation built to spec." [level=3] [ref=e269]
              - generic [ref=e270]:
                - generic [ref=e271]:
                  - paragraph [ref=e272]: We chose
                  - paragraph [ref=e273]: Full visionOS accessibility API integration
                - generic [ref=e274]:
                  - paragraph [ref=e275]: Over
                  - paragraph [ref=e276]: Defer accessibility to post-launch iteration
              - paragraph [ref=e277]: Vestibular disorders affect approximately 35% of adults over 40. Enterprise workforces skew older than consumer apps. A spatial experience with unchecked motion can trigger dizziness, nausea, or disorientation in a meaningful proportion of any enterprise deployment. Motion sensitivity toggle and dwell time customisation are first-class features in Orbit — not post-launch additions. Accessibility is not a checkbox at the end of the design process.
      - generic [ref=e280]:
        - generic [ref=e281]:
          - paragraph [ref=e282]: 04 — Artefacts
          - heading "What got made." [level=2] [ref=e283]
          - paragraph [ref=e284]: Five design artefacts that translate the concept into concrete deliverables — each described in production-ready detail for Figma implementation.
        - generic [ref=e285]:
          - generic [ref=e287]:
            - img [ref=e289]
            - generic [ref=e293]:
              - paragraph [ref=e294]: Journey Map
              - heading "Spatial user journey map" [level=3] [ref=e295]
              - paragraph [ref=e296]: A non-linear journey map plotted across four onboarding sessions (Day 1, Week 1, Week 2, Month 1), tracking spatial awareness, cognitive load, AI agent touchpoints, and emotional state. Depth notation shows when information is revealed in the foreground vs mid-ground plane — reflecting the actual disclosure model rather than a linear page flow.
              - generic [ref=e298]: Connects to Decision 03 — Progressive disclosure
          - generic [ref=e300]:
            - img [ref=e302]
            - generic [ref=e305]:
              - paragraph [ref=e306]: IA / Structure
              - heading "3D information architecture diagram" [level=3] [ref=e307]
              - paragraph [ref=e308]: "A depth-annotated IA diagram showing how content is distributed across Orbit's three spatial planes. Foreground: personal context (my team, my tools, today's focus). Mid-ground: department context. Background: organisational context. Each plane has a defined interaction grammar — foreground uses gaze + pinch, mid-ground uses dwell, background uses AI agent-initiated disclosure."
              - generic [ref=e310]: Connects to Decisions 03 + 04 — Depth planes + FOV constraint
          - generic [ref=e312]:
            - img [ref=e314]
            - generic [ref=e316]:
              - paragraph [ref=e317]: UI Screens
              - heading "Vision Pro UI screens (4 key states)" [level=3] [ref=e318]
              - paragraph [ref=e319]: "Four production-ready visionOS screens: (1) Spatial Org Map home state — floating team cards in a constellation within the 60° comfort zone. (2) Team Detail panel — mid-ground slides forward with role cards and AI-suggested introductions. (3) Tool Discovery panel — 3D dock of enterprise tools with contextual tooltips. (4) Day 1 Checklist — ambient floating checklist in far-left peripheral zone."
              - generic [ref=e321]: Connects to all five design decisions
          - generic [ref=e323]:
            - img [ref=e325]
            - generic [ref=e327]:
              - paragraph [ref=e328]: Conversation Design
              - heading "AI agent conversation flow" [level=3] [ref=e329]
              - paragraph [ref=e330]: "A branching conversation flow for the Orbit AI agent across the Day 1 session. Key moments: welcome + spatial orientation (no menu required), first gaze event detection triggering proactive context injection, error-graceful fallbacks when gaze is ambiguous, and the transition from guided to autonomous navigation at session end. Role-parameterised: an engineer and an account manager receive different first-hour disclosure paths."
              - generic [ref=e332]: Connects to Decision 02 — Voice-first AI agent
          - generic [ref=e334]:
            - img [ref=e336]
            - generic [ref=e340]:
              - paragraph [ref=e341]: Wireframe
              - heading "Depth plane wireframe concept" [level=3] [ref=e342]
              - paragraph [ref=e343]: A low-fidelity wireframe annotated with depth plane distances (in metres from eye position), interaction grammar per plane, and motion vectors for transitions between foreground, mid-ground, and background states. Includes a reduced-motion variant showing the accessibility path — all transitions replaced with cross-fades and static position changes, no parallax or scaling effects.
              - generic [ref=e345]: Connects to Decisions 04 + 05 — FOV constraint + accessibility
