          - paragraph [ref=e477]: 06 — Reflection
          - heading "What I'd do differently." [level=2] [ref=e478]
          - paragraph [ref=e479]: Speculative work earns credibility through honest self-assessment. Here is what I'd validate, what I'd cut, and what designing for a genuinely new modality taught me.
        - generic [ref=e480]:
          - generic [ref=e481]:
            - img [ref=e483]
            - generic [ref=e485]:
              - paragraph [ref=e486]: What I'd validate first
              - paragraph [ref=e487]: The 3-hour context claim
              - paragraph [ref=e488]: "The core value proposition — spatial context in 3 hours vs 3 weeks — is the hypothesis everything else rests on. Before building further, I'd run a constrained usability study: two cohorts of enterprise new hires, one through a spatial visionOS prototype, one through standard wiki + Slack onboarding. Measuring time to first correct answer on 10 org-structure questions and self-reported confidence would either validate the bet or force a fundamental reframe. No amount of design quality makes the wrong bet right."
          - generic [ref=e489]:
            - img [ref=e491]
            - generic [ref=e497]:
              - paragraph [ref=e498]: What I'd cut in V2
              - paragraph [ref=e499]: The background org plane
              - paragraph [ref=e500]: The three-plane information architecture is conceptually clean but the background plane — full org structure, cross-functional dependencies — is informationally dense for day one. In V2 I'd make it exclusively available from week two onward, unlocked by session completion milestones. This tightens progressive disclosure further and removes the risk of Orbit recreating the information overload it was designed to solve. Depth is only valuable if the content behind it earns the user's attention.
          - generic [ref=e501]:
            - img [ref=e503]
            - generic [ref=e506]:
              - paragraph [ref=e507]: What I learned
              - paragraph [ref=e508]: Spatial UX has no inherited grammar
              - paragraph [ref=e509]: "Every medium I've designed for — web, mobile, plugin — has an interaction grammar users bring with them. visionOS does not. This means every interaction needs to be taught, not assumed. It surfaced a principle I want to carry forward: when you are designing for a new modality, the onboarding of the onboarding tool is itself a design problem. Orbit would need a 5-minute spatial tutorial before the spatial org map. The meta-layer is not a nice-to-have."
        - generic [ref=e510]:
          - paragraph [ref=e511]: Why this work exists
          - paragraph [ref=e512]: Orbit is a bet that spatial computing will reshape how enterprise knowledge is delivered — and that the designers who understand that modality now will define what it becomes.
          - paragraph [ref=e513]: This is speculative work — deliberately so. The best time to think carefully about a new interaction paradigm is before the market forces you to think fast. Orbit is that thinking, made concrete.
