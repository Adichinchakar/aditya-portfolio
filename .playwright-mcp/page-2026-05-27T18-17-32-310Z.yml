            - paragraph [ref=e36]: New enterprise hires lose 3–6 months of productivity to context overload. Orbit is an AI agent-guided onboarding experience on Apple Vision Pro — collapsing weeks of context-building into hours through spatial mapping, gaze navigation, and progressive disclosure.
