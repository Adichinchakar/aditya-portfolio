            - generic [ref=e917]:
              - 'heading "What didn''t work: V1 enrollment flow" [level=3] [ref=e918]'
              - paragraph [ref=e919]: The initial ABHA enrollment UX assumed patients had reliable OTP delivery. In the Delhi NCR pilot, ~30% of rural users failed the first enrollment attempt because of SMS delivery delays on BSNL networks. We had over-indexed on the tech architecture and under-indexed on last-mile connectivity constraints. V2 added a QR-scan fallback via PHC kiosks, which cut enrollment failure to under 4%.
          - generic [ref=e921]:
            - img [ref=e923]
            - generic [ref=e925]:
              - 'heading "If I started over: validate the consent model earlier" [level=3] [ref=e926]'
              - paragraph [ref=e927]: The family-consent (CareCircle) feature was designed in week 3 and tested only in week 10. In practice, patients had deeply varying expectations about who should control record access — a 65-year-old farmer in Pune vs. a 28-year-old in Delhi. I'd run consent-model interviews in the first research sprint, not the last. This would have surfaced the 'proxy guardian' edge case before it became a pilot pain point.
