        - generic [ref=e436]:
          - heading "Strategic Takeaway & Hypothesis" [level=2] [ref=e437]
          - paragraph [ref=e438]: Feature velocity is not the same as product value. Every feature added to a home screen is a tax on the user's attention — and attention is the scarcest resource in a daily banking app.
          - paragraph [ref=e439]: "The core finding: cognitive overload in primary financial flows is a design problem with a design solution. Intent-led architecture — routing users to the right context before surfacing options — reduces abandonment without removing features. The hypothesis is that completion rates on core flows are a stronger predictor of 12-month retention than cross-sell engagement rate."
