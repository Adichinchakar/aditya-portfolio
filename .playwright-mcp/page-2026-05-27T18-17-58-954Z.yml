        - heading "The \"Super-App\" Paradox" [level=2] [ref=e100]
        - generic [ref=e101]:
          - paragraph [ref=e102]: In the race to become the ultimate financial "Super-App," Tier-1 Neobanks have aggressively layered crypto, commodities, lifestyle subscriptions, and travel features onto checking account foundations — without restructuring the underlying information architecture to carry that weight.
          - paragraph [ref=e103]:
            - text: "This audit started from a specific hypothesis:"
            - strong [ref=e104]: horizontal feature expansion increases cognitive load on primary financial flows
            - text: ", measurable through task abandonment rate and time-on-task for core actions (balance check, P2P transfer, account freeze resolution). To pressure-test this, I conducted a structured heuristic evaluation of Revolut, Jupiter, and Fi Money against Nielsen's 10 usability principles, supplemented by sentiment analysis across App Store and Trustpilot reviews — categorized by flow type and failure mode."
          - paragraph [ref=e105]: "The pattern was consistent: support ticket spikes correlate with feature launches, not outages. Users aren't failing because the product is broken — they're failing because the navigation model no longer matches their intent."
          - paragraph [ref=e106]: "Methodology note: This is an unsolicited competitive audit. Validation would require instrumented A/B testing in production — estimated feasibility: 8-week sprint with analytics infrastructure in place."
      - generic [ref=e108]:
        - generic [ref=e109]:
          - 'heading "The UX Audit: Signal vs. Noise" [level=2] [ref=e110]'
          - paragraph [ref=e111]: Heuristic evaluation against Nielsen's 10 principles surfaced three compounding failure modes — each solvable at the design layer, independent of backend reliability.
        - generic [ref=e112]:
          - generic [ref=e113]:
            - img [ref=e115]
            - heading "Crisis UX Failure" [level=3] [ref=e117]
            - paragraph [ref=e118]: Account freezes from over-sensitive fraud models drop users into a generic support bot with no status visibility, no ETA, and no escalation path. This is a solvable UX problem — not a trust problem. The product works; the crisis flow doesn't.
            - generic [ref=e119]: "\"Your account is frozen. We'll get back to you.\" — with zero queue time, zero human ETA, zero card status shown."
          - generic [ref=e120]:
            - img [ref=e122]
            - heading "Architectural Bloat" [level=3] [ref=e126]
            - paragraph [ref=e127]: "Checking accounts, high-yield vaults, and volatile crypto coexist in a single scrolling \"Hub\" with no visual hierarchy between them. Each new feature launch appends to the bottom — never restructures the top. This is an IA problem with a measurable cost: task abandonment on primary flows increases with every non-core feature added to the home screen."
            - generic [ref=e128]: "Heuristic #8 (Aesthetic minimalism): \"Every extra unit of information competes with the relevant units of information and diminishes their relative visibility.\""
          - generic [ref=e129]:
            - img [ref=e131]
            - heading "Flattened Intent Hierarchy" [level=3] [ref=e134]
            - paragraph [ref=e135]: Grocery spending cash and a fluctuating crypto portfolio render at the same visual weight. Users who open the app to check their balance are interrupted by market tickers. The IA conflates two fundamentally different user intents — daily liquidity management and wealth generation — into a single undifferentiated surface.
            - generic [ref=e136]: The fix isn't removing features — it's routing users to the right context before showing them anything. Intent-first navigation over feature-first navigation.
      - generic [ref=e138]:
        - generic [ref=e139]:
          - generic [ref=e140]: Strategic Pivot
          - heading "\"Intent-Led\" Architecture" [level=2] [ref=e141]
          - paragraph [ref=e142]: "To resolve these systemic issues, we must reject the \"kitchen sink\" dashboard. The UX strategy pivots to an architecture that respects the user's cognitive load and prioritizes absolute transparency through three core pillars:"
        - generic [ref=e143]:
          - generic [ref=e144]:
            - generic [ref=e145]:
              - img [ref=e147]
              - heading "1. Dynamic Routing" [level=3] [ref=e151]
            - generic [ref=e152]:
              - paragraph [ref=e153]: "Instead of a static modular grid, the home screen must adapt to the user's primary \"velocity\". We bifurcate the IA into two distinct ecosystem layers:"
              - generic [ref=e154]:
                - generic [ref=e155]:
                  - heading "Daily Velocity" [level=4] [ref=e156]
                  - paragraph [ref=e157]: Checking, cards, P2P transfers. Minimalist, high contrast, zero promotional banners — optimized for sub-30-second task completion.
                - generic [ref=e158]:
                  - heading "Wealth Layer" [level=4] [ref=e159]
                  - paragraph [ref=e160]: Vaults, equities, crypto. Denser chart layouts with explicit risk labels — never co-mingled with daily liquid funds in the same balance total.
          - generic [ref=e161]:
            - generic [ref=e162]:
              - img [ref=e164]
              - heading "2. High-Fidelity Crisis UX" [level=3] [ref=e167]
            - generic [ref=e168]:
              - paragraph [ref=e169]: Redesigning the support flow specifically for anxiety reduction and complete transparency. A user with frozen funds should never see an ad for airport lounge access.
              - generic [ref=e170]:
                - generic [ref=e171]:
                  - img [ref=e172]
                  - generic [ref=e174]: The "Crisis Node"
                - paragraph [ref=e175]: "\"Your account is locked for a security review. A specialized agent [Avatar] will review this. Current queue time: ~14 minutes. Your physical card auto-declines are active for safety.\""
          - generic [ref=e176]:
            - generic [ref=e177]:
              - img [ref=e179]
              - heading "3. Progressive Disclosure" [level=3] [ref=e188]
            - generic [ref=e189]:
              - paragraph [ref=e190]: Stop throwing features at the user; let them pull what they need. Empower users to curate their own financial dashboard.
              - list [ref=e191]:
                - listitem [ref=e192]:
                  - generic [ref=e195]: Allow users to "pin" their top 3–4 core modules to the primary view.
                - listitem [ref=e196]:
                  - generic [ref=e199]: Archive the rest in a deep, categorized "Discover" section — surfaced by behavior, not homepage real estate.
                - listitem [ref=e200]:
                  - generic [ref=e203]: "Directional target: −60% UI complexity score (Figma token audit method)."
              - generic [ref=e204]:
                - strong [ref=e205]: "Design tension acknowledged:"
                - text: Progressive disclosure reduces promotional surface area — a real business constraint. The hypothesis is that reduced bounce on primary flows raises LTV more than cross-sell impressions on a cluttered home screen. This would need revenue modeling to validate before shipping.
