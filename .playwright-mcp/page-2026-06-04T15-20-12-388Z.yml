            - generic [ref=e535]: Design Constraint
            - heading "Figma plugin API shapes every interaction decision" [level=3] [ref=e536]
            - paragraph [ref=e537]: The plugin runtime has no background threads — every scan must complete synchronously within a 60fps canvas budget. This ruled out streaming results, forced a batch-scan model, and made the progressive reveal of violations (grouped, not streamed) a technical necessity, not just a UX preference.
          - generic [ref=e538]:
            - img [ref=e540]
            - generic [ref=e542]: What didn't work
            - heading "V1 had drag-to-reorder violations — too complex" [level=3] [ref=e543]
            - paragraph [ref=e544]: The first violations list let users drag-and-drop to reprioritize issues. In beta testing with junior designers (primary target users), this interaction pattern caused confusion — they expected the list to be sorted by severity, not be a task manager. Removed it in v2 and defaulted to severity-ordered, read-only grouping. Fix rate improved.
          - generic [ref=e545]:
            - img [ref=e547]
            - generic [ref=e550]: Next time
            - heading "Design decisions need to be documented as they happen" [level=3] [ref=e551]
            - paragraph [ref=e552]: When context-switching between design and engineering, I lost the rationale for several key UX decisions. I now maintain a lightweight decision log alongside the codebase.
        - generic [ref=e553]:
