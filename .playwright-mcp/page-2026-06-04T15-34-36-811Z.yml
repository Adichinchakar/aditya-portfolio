          - 'heading "Enterprise Talent Platform: Making Skills Visible" [level=2] [ref=e190]'
          - paragraph [ref=e191]:
            - text: A large services organisation rarely has a talent shortage — it has a talent
            - emphasis [ref=e192]: visibility
            - text: "problem. Project managers can't find people with the right skills because those people are invisible: siloed inside delivery units, tagged by role title, not actual capability."
        - generic [ref=e193]:
          - generic [ref=e194]:
            - paragraph [ref=e195]: The Problem
            - paragraph [ref=e196]: A project manager in Bangalore needs someone with React + financial domain experience available in 3 weeks. That person exists in Mumbai. There is no system that surfaces them. The PM posts the role externally instead.
            - paragraph [ref=e197]: "This happens thousands of times a year — not from lack of talent, but from a design problem: the internal talent system was built for HR record-keeping, not for managers who think in terms of skills, availability, and project fit."
          - generic [ref=e198]:
