          - paragraph [ref=e401]: 04 — Design Iterations
          - heading "How the AI Confidence Signal Evolved" [level=2] [ref=e402]
          - paragraph [ref=e403]: 3 rounds of internal testing with teachers before the confidence signal shipped. Each round invalidated a prior assumption.
        - generic [ref=e404]:
          - generic [ref=e405]:
            - generic [ref=e406]:
              - generic [ref=e407]: Round 1
              - generic [ref=e408]: Raw percentage (68% confident)
            - generic [ref=e409]:
              - generic [ref=e410]: Finding
              - paragraph [ref=e411]: Teachers over-trusted 80%+ scores as guarantees; dismissed 60%- scores entirely. Binary thinking, not probabilistic.
            - generic [ref=e412]:
              - generic [ref=e413]: Decision
              - paragraph [ref=e414]: Drop percentages. Switch to qualitative signals.
          - generic [ref=e415]:
            - generic [ref=e416]:
              - generic [ref=e417]: Round 2
              - generic [ref=e418]: Traffic-light system (Red / Amber / Green)
            - generic [ref=e419]:
              - generic [ref=e420]: Finding
              - paragraph [ref=e421]: Green triggered rubber-stamping — teachers stopped reading the rubric text. 'Green means approve' was too automatic.
            - generic [ref=e422]:
              - generic [ref=e423]: Decision
              - paragraph [ref=e424]: Remove green. Reframe as signal, not verdict.
          - generic [ref=e425]:
            - generic [ref=e426]:
              - generic [ref=e427]: Round 3
              - generic [ref=e428]: 3-tier signal (Verified / Suggested / Uncertain)
            - generic [ref=e429]:
              - generic [ref=e430]: Finding
              - paragraph [ref=e431]: Teachers engaged differently at each tier — Verified rubrics were approved far faster; Uncertain triggered review. Acceptance roughly doubled.
            - generic [ref=e432]:
              - generic [ref=e433]: Decision
              - paragraph [ref=e434]: Ship this version. Anchored in pedagogical action, not probability.
