            - paragraph [ref=e575]: 06 — Reflection
            - heading "What I'd Do Differently" [level=2] [ref=e576]
            - paragraph [ref=e577]: Building a 0→1 product solo — design, engineering, and product — taught me things no spec document ever could.
          - generic [ref=e578]:
            - generic [ref=e579]:
              - img [ref=e581]
              - generic [ref=e583]: Design Constraint
              - heading "Figma plugin API shapes every interaction decision" [level=3] [ref=e584]
              - paragraph [ref=e585]: The plugin runtime has no background threads — every scan must complete synchronously within a 60fps canvas budget. This ruled out streaming results, forced a batch-scan model, and made the progressive reveal of violations (grouped, not streamed) a technical necessity, not just a UX preference.
            - generic [ref=e586]:
              - img [ref=e588]
              - generic [ref=e590]: What didn't work
              - heading "V1 had drag-to-reorder violations — too complex" [level=3] [ref=e591]
              - paragraph [ref=e592]: The first violations list let users drag-and-drop to reprioritize issues. In beta testing with junior designers (primary target users), this interaction pattern caused confusion — they expected the list to be sorted by severity, not be a task manager. Removed it in v2 and defaulted to severity-ordered, read-only grouping — and testers stopped asking 'what do I fix first?'
            - generic [ref=e593]:
              - img [ref=e595]
              - generic [ref=e598]: Next time
              - heading "Design decisions need to be documented as they happen" [level=3] [ref=e599]
              - paragraph [ref=e600]: When context-switching between design and engineering, I lost the rationale for several key UX decisions. I now maintain a lightweight decision log alongside the codebase.
          - generic [ref=e601]:
            - paragraph [ref=e602]: Aulys is still evolving. The CI/CD platform is in active development — and with 30 beta designers giving live feedback, it's going in the right direction.
            - paragraph [ref=e603]: Solo doesn't mean in a vacuum. I ran a structured feedback loop with 30 beta designers — triaging conflicting requests, deciding what to build and what to refuse (the drag-to-reorder removal above came straight from that loop). Reconciling real user signal against a clear product thesis is the same judgment a design lead exercises with a team.
            - paragraph [ref=e604]: "What Aulys proved: a solo designer-founder, using AI tools for execution, can ship a real accessibility product with real users — in less time than most teams take to write a PRD. The constraint wasn't capability. It was knowing exactly what problem to solve and refusing to scope-creep past it."
