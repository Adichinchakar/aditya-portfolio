<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Orbit - Tool Discovery</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;700;800;900&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "on-primary": "#2f3131",
            "on-primary-fixed": "#1a1c1c",
            "on-tertiary-fixed-variant": "#572ba0",
            "surface-container": "#1f1f22",
            "outline": "#958ea0",
            "on-tertiary-container": "#37007c",
            "tertiary": "#d3bbff",
            "on-surface": "#e4e1e6",
            "primary-fixed-dim": "#c6c6c7",
            "surface": "#131316",
            "on-error-container": "#ffdad6",
            "inverse-on-surface": "#303033",
            "surface-bright": "#39393c",
            "on-tertiary-fixed": "#260059",
            "on-secondary": "#3c0091",
            "inverse-surface": "#e4e1e6",
            "secondary-fixed-dim": "#d0bcff",
            "primary-fixed": "#e2e2e2",
            "on-error": "#690005",
            "surface-container-lowest": "#0e0e11",
            "on-secondary-fixed-variant": "#5516be",
            "primary-container": "#909191",
            "secondary": "#d0bcff",
            "tertiary-fixed": "#ebdcff",
            "tertiary-container": "#a37af1",
            "on-primary-container": "#282a2a",
            "tertiary-fixed-dim": "#d3bbff",
            "on-secondary-container": "#c4abff",
            "surface-variant": "#353438",
            "on-surface-variant": "#cbc3d7",
            "outline-variant": "#494454",
            "on-background": "#e4e1e6",
            "error-container": "#93000a",
            "on-secondary-fixed": "#23005c",
            "secondary-container": "#571bc1",
            "background": "#131316",
            "error": "#ffb4ab",
            "surface-container-highest": "#353438",
            "inverse-primary": "#5d5f5f",
            "on-primary-fixed-variant": "#454747",
            "surface-dim": "#131316",
            "surface-container-low": "#1b1b1e",
            "on-tertiary": "#3f0689",
            "primary": "#c6c6c7",
            "surface-container-high": "#2a2a2d",
            "secondary-fixed": "#e9ddff",
            "surface-tint": "#c6c6c7"
          },
          fontFamily: {
            "headline": ["Epilogue"],
            "body": ["Inter"],
            "label": ["Inter"]
          },
          borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
        },
      },
    }
  </script>
<style>
    body {
      background-color: #131316;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
    }
    .obsidian-glow {
      background: radial-gradient(circle at 50% 50%, rgba(87, 27, 193, 0.15) 0%, rgba(19, 19, 22, 0) 70%);
    }
    .glass-rail {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(40px);
    }
    .voice-panel {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(48px);
    }
    .tool-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .active-tool {
      box-shadow: 0 0 20px rgba(208, 188, 255, 0.3);
      border-color: rgba(208, 188, 255, 0.5);
      transform: scale(1.05) translateY(-8px);
    }
    .waveform-bar {
      width: 3px;
      background: #d0bcff;
      border-radius: 99px;
    }
  </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen text-on-surface obsidian-glow px-12">
<!-- AI Voice Panel -->
<div class="fixed top-12 left-12 right-12 flex justify-center z-50">
<div class="voice-panel w-full max-w-5xl h-[72px] rounded-full flex items-center px-8 shadow-2xl">
<div class="flex items-end gap-1 h-6 mr-6">
<div class="waveform-bar h-2"></div>
<div class="waveform-bar h-5"></div>
<div class="waveform-bar h-3"></div>
<div class="waveform-bar h-4"></div>
</div>
<p class="text-[13px] font-medium tracking-tight text-white/90 font-body">
        Your primary tools are ready. Start with Slack, your team is active now.<span class="inline-block w-1.5 h-1.5 bg-secondary rounded-full ml-2"></span>
</p>
</div>
</div>
<!-- Main Tool Discovery Volume -->
<main class="relative flex flex-col items-center gap-12 mt-20">
<header class="text-center mb-4">
<h1 class="font-headline text-5xl font-black text-white italic tracking-tighter mb-2">Orbit</h1>
<p class="text-on-surface-variant font-body uppercase tracking-[0.2em] text-[10px] font-semibold">Discovery Phase</p>
</header>
<!-- Tool Rail -->
<div class="glass-rail p-4 rounded-3xl flex items-end gap-6 shadow-2xl relative">
<!-- Slack Card (Active/Focus) -->
<div class="relative group">
<!-- Floating Tooltip -->
<div class="absolute -top-16 left-1/2 -translate-x-1/2 bg-surface-container-high px-4 py-2 rounded-xl whitespace-nowrap text-xs border border-outline-variant/20 shadow-xl opacity-100 transition-all">
          You have access <span class="text-secondary font-bold">23 unread</span> in #general
        </div>
<div class="tool-card active-tool w-[160px] h-[140px] rounded-2xl flex flex-col items-center justify-center gap-4 bg-gradient-to-br from-[#4A154B]/30 to-transparent">
<div class="w-12 h-12 flex items-center justify-center text-white">
<span class="material-symbols-outlined text-4xl" data-icon="chat">chat</span>
</div>
<span class="font-label text-sm font-semibold text-white">Slack</span>
</div>
</div>
<!-- Jira Card -->
<div class="tool-card w-[160px] h-[140px] rounded-2xl flex flex-col items-center justify-center gap-4 hover:scale-105 transition-transform cursor-pointer bg-gradient-to-br from-[#0052CC]/10 to-transparent">
<div class="w-12 h-12 flex items-center justify-center text-white/60">
<span class="material-symbols-outlined text-4xl" data-icon="task_alt">task_alt</span>
</div>
<span class="font-label text-sm font-semibold text-white/60">Jira</span>
</div>
<!-- Figma Card -->
<div class="tool-card w-[160px] h-[140px] rounded-2xl flex flex-col items-center justify-center gap-4 hover:scale-105 transition-transform cursor-pointer bg-gradient-to-br from-[#F24E1E]/10 to-transparent">
<div class="w-12 h-12 flex items-center justify-center text-white/60">
<span class="material-symbols-outlined text-4xl" data-icon="polyline">polyline</span>
</div>
<span class="font-label text-sm font-semibold text-white/60">Figma</span>
</div>
<!-- GitHub Card -->
<div class="tool-card w-[160px] h-[140px] rounded-2xl flex flex-col items-center justify-center gap-4 hover:scale-105 transition-transform cursor-pointer">
<div class="w-12 h-12 flex items-center justify-center text-white/60">
<span class="material-symbols-outlined text-4xl" data-icon="code">code</span>
</div>
<span class="font-label text-sm font-semibold text-white/60">GitHub</span>
</div>
<!-- Confluence Card -->
<div class="tool-card w-[160px] h-[140px] rounded-2xl flex flex-col items-center justify-center gap-4 hover:scale-105 transition-transform cursor-pointer bg-gradient-to-br from-[#172B4D]/10 to-transparent">
<div class="w-12 h-12 flex items-center justify-center text-white/60">
<span class="material-symbols-outlined text-4xl" data-icon="description">description</span>
</div>
<span class="font-label text-sm font-semibold text-white/60">Confluence</span>
</div>
<!-- Workday Card -->
<div class="tool-card w-[160px] h-[140px] rounded-2xl flex flex-col items-center justify-center gap-4 hover:scale-105 transition-transform cursor-pointer">
<div class="w-12 h-12 flex items-center justify-center text-white/60">
<span class="material-symbols-outlined text-4xl" data-icon="badge">badge</span>
</div>
<span class="font-label text-sm font-semibold text-white/60">Workday</span>
</div>
</div>
</main>
<!-- Step Footer -->
<div class="fixed bottom-12 left-12 flex items-center gap-6">
<div class="glass-rail py-3 px-6 rounded-full flex items-center gap-4">
<span class="text-xs font-semibold text-white/80">Tool Setup Step 2 of 5</span>
<div class="flex gap-1.5">
<div class="w-1.5 h-1.5 rounded-full bg-secondary"></div>
<div class="w-1.5 h-1.5 rounded-full bg-secondary"></div>
<div class="w-1.5 h-1.5 rounded-full bg-zinc-600"></div>
<div class="w-1.5 h-1.5 rounded-full bg-zinc-600"></div>
<div class="w-1.5 h-1.5 rounded-full bg-zinc-600"></div>
</div>
</div>
</div>
<!-- Spatial Atmospheric Glows -->
<div class="fixed inset-0 pointer-events-none -z-10 overflow-hidden">
<div class="absolute top-1/4 left-1/4 w-[600px] h-[600px] bg-secondary-container/10 blur-[120px] rounded-full"></div>
<div class="absolute bottom-1/4 right-1/4 w-[400px] h-[400px] bg-tertiary-container/5 blur-[100px] rounded-full"></div>
</div>
</body></html>
